[package]
name = "driver-break-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Driver Break navigation core: elevation, routing, POI, rest parameters"

[features]
default = []
## Pure-Rust gpsd TCP/JSON client via `gpsd_proto` (no libgps).
gpsd = ["dep:gpsd_proto"]
## Linux SBC IMU publish helpers (software fusion stub; board drivers optional).
linux-imu = []

[dependencies]
anyhow.workspace = true
bincode.workspace = true
geo.workspace = true
geo-types.workspace = true
pathfinding.workspace = true
reqwest.workspace = true
futures-util = "0.3"
bytes = "1"
pmtiles = { version = "0.23", default-features = false, features = ["write", "mmap-async-tokio"] }
rstar.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
srtm_reader.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
osmpbf.workspace = true
osm4routing.workspace = true
geotiff.workspace = true
zip.workspace = true
tar = { workspace = true }
rayon.workspace = true
libc.workspace = true
log.workspace = true
usvg.workspace = true
resvg.workspace = true
flate2.workspace = true
png.workspace = true
rkyv = { workspace = true }
memmap2 = { workspace = true }
gpsd_proto = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3"
rayon = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
osm4routing = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
anyhow = { workspace = true }
