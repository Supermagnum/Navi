[package]
name = "navi-cat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Navi CAT host: RigBackend, gating, read-back, repeater DB"
publish = false

[features]
default = []
## Allow Hamlib dummy rig (model 1) past Stable gating in tests.
allow-dummy-rig = []
## Link navi-hamlib-sys against real libhamlib.
ffi = ["navi-hamlib-sys/link-hamlib"]
## Host diagnostic binaries (not built by default / release / automatic CI).
diag-bins = []

[dependencies]
anyhow.workspace = true
hex.workspace = true
libc.workspace = true
log.workspace = true
navi-hamlib-sys = { path = "../navi-hamlib-sys" }
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "blocking", "json"] }
roxmltree.workspace = true
rusqlite.workspace = true
zip.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time", "sync"] }
zstd = "0.14"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "benshi-hw-probe"
path = "src/bin/benshi_hw_probe.rs"
required-features = []

[[bin]]
name = "benshi-hw-demo"
path = "src/bin/benshi_hw_demo.rs"
required-features = []

[[bin]]
name = "repeater_corridor_check"
path = "src/bin/repeater_corridor_check.rs"
required-features = ["diag-bins"]
