[package]
name = "navi-cat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Navi CAT host: RigBackend, gating, read-back, repeater DB"
publish = false

[features]
default = []
## Allow Hamlib dummy rig (model 1) past Stable gating in tests.
allow-dummy-rig = []
## Link navi-hamlib-sys against real libhamlib.
ffi = ["navi-hamlib-sys/link-hamlib"]

[dependencies]
anyhow.workspace = true
log.workspace = true
navi-hamlib-sys = { path = "../navi-hamlib-sys" }
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
