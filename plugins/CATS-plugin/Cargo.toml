[package]
name = "navi-plugin-cats"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
navi-plugin-sdk = { path = "../../plugin-sdk" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
navi-cat = { path = "../../navi-cat" }

[lib]
# cdylib for wasmtime guest; rlib so host/CI tests can exercise follow/demo.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
