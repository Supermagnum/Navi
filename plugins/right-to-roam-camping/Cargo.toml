[package]
name = "navi-plugin-right-to-roam-camping"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
navi-plugin-sdk = { path = "../../plugin-sdk" }
navi-right-to-roam-camping = { path = "./engine", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
