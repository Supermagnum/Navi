[package]
name = "navi-plugin-imu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
navi-plugin-sdk = { path = "../../plugin-sdk" }
navi-plugin-imu-engine = { path = "./engine" }
serde_json = { workspace = true }

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
