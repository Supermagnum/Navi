[package]
name = "navi-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for Navi / driver-break-core on Android and other hosts"
autobins = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "navi"

[features]
default = []
## Link onboard Hamlib via navi-cat/ffi (Android native builds).
hamlib-ffi = ["navi-cat/ffi", "dep:navi-hamlib-sys", "navi-hamlib-sys/link-hamlib"]

[dependencies]
driver-break-core = { path = "../core" }
navi-plugin-host = { path = "../plugin-host" }
navi-cat = { path = "../navi-cat" }
navi-hamlib-sys = { path = "../navi-hamlib-sys", optional = true }
navi-right-to-roam-camping = { path = "../plugins/right-to-roam-camping/engine", default-features = false, features = ["native"] }
chrono = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }
osm4routing = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rusqlite = { workspace = true }
geo-types = { workspace = true }
rkyv = { workspace = true }
memmap2 = { workspace = true }
pathfinding = { workspace = true }
osmpbf = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "plan-skolla-rondvassbu"
path = "src/bin/plan_skolla_rondvassbu.rs"
required-features = ["diag-bins"]

[[bin]]
name = "plan-nashaugs-skriurusten-matrix"
path = "src/bin/plan_nashaugs_skriurusten_matrix.rs"
required-features = ["diag-bins"]

