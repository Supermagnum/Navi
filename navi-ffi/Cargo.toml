[package]
name = "navi-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for Navi / driver-break-core on Android and other hosts"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "navi"

[dependencies]
driver-break-core = { path = "../core" }
chrono = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }
osm4routing = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rusqlite = { workspace = true }
geo-types = { workspace = true }
rkyv = { workspace = true }
memmap2 = { workspace = true }
pathfinding = { workspace = true }
osmpbf = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "plan-skolla-rondvassbu"
path = "src/bin/plan_skolla_rondvassbu.rs"

[[bin]]
name = "plan-truck-live-gps"
path = "src/bin/plan_truck_live_gps.rs"

[[bin]]
name = "indexed-rtree-poc"
path = "src/bin/indexed_rtree_poc.rs"

[[bin]]
name = "rkyv-mmap-graph-poc"
path = "src/bin/rkyv_mmap_graph_poc.rs"

[[bin]]
name = "rkyv-mmap-poi-barrier-poc"
path = "src/bin/rkyv_mmap_poi_barrier_poc.rs"

[[bin]]
name = "navi-indexed-convert"
path = "src/bin/navi_indexed_convert.rs"

[[bin]]
name = "navi-indexed-bench"
path = "src/bin/navi_indexed_bench.rs"

[[bin]]
name = "navi-indexed-plan-bench"
path = "src/bin/navi_indexed_plan_bench.rs"

[[bin]]
name = "navi-wetland-bench"
path = "src/bin/navi_wetland_bench.rs"
