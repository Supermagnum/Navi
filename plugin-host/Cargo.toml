[package]
name = "navi-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM plugin host for Navi (wasmtime, fuel and wall-clock limited)"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasmtime = { version = "48", default-features = false, features = ["cranelift", "runtime", "gc-drc"] }

[[bin]]
name = "android_isolation_smoke"
path = "src/bin/android_isolation_smoke.rs"

[dev-dependencies]
chrono = { workspace = true }
driver-break-core = { path = "../core" }
navi-right-to-roam-camping = { path = "../right-to-roam-camping" }
tempfile = "3"
