[package]
name = "navi-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
[dependencies.driver-break-core]
path = "../core"

[dependencies.navi-cat]
path = "../navi-cat"

[dependencies.navi-plugin-host]
path = "../plugin-host"

[dependencies.serde_json]
version = "1"

[dependencies.tempfile]
version = "3"

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std"]

# Isolate from the workspace so cargo-fuzz can use nightly without
# rebuilding the pinned 1.98 workspace members as a unit.
[workspace]
members = ["."]

[[bin]]
name = "gpx_import"
path = "fuzz_targets/gpx_import.rs"
test = false
doc = false
bench = false

