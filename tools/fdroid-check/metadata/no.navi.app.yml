AutoName: Navi

RepoType: git
Repo: https://github.com/Supermagnum/Navi.git

# Convenience prebuilts under jniLibs/ are for local/CI Gradle-only assemble.
# F-Droid must not package them: rm: deletes those files, then the recipe
# cross-compiles from Rust source.

Builds:
  - versionName: 0.3.6-beta
    versionCode: 11
    commit: 2ae24b3be0288e6b7f00e67be9b18d41a88e1b6f
    timeout: 14400
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends
        build-essential
        curl
        ca-certificates
        openjdk-17-jdk-headless
        python3
        pkg-config
        libssl-dev
      - update-java-alternatives -a || true
    gradle: yes
    rm:
      - app/src/main/jniLibs/arm64-v8a/libnavi.so
      - app/src/main/jniLibs/x86_64/libnavi.so
    prebuild:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/.cargo/bin:${PATH:-}"
      - |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | bash -s -- -y --default-toolchain 1.98.0 --profile minimal
        fi
      - . "$HOME/.cargo/env"
      - rustup toolchain install 1.98.0 --profile minimal
      - rustup default 1.98.0
      - rustup target add aarch64-linux-android x86_64-linux-android wasm32-unknown-unknown
      - rustc --version
      - NDK="$$NDK$$"
      - test -n "$NDK"
      - test -d "$NDK"
      - CLANG_PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - mkdir -p ../.cargo
      - |
        printf '%s\n' \
          '[target.x86_64-linux-android]' \
          "linker = \"$CLANG_PRE/x86_64-linux-android34-clang\"" \
          'rustflags = ["-C", "link-arg=-lc++_shared"]' \
          '' \
          '[target.aarch64-linux-android]' \
          "linker = \"$CLANG_PRE/aarch64-linux-android34-clang\"" \
          'rustflags = ["-C", "link-arg=-lc++_shared"]' \
          > ../.cargo/config.toml
      - printf 'sdk.dir=%s\nndk.dir=%s\n' "$$SDK$$" "$$NDK$$" > ../local.properties
    build:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/.cargo/bin:${PATH:-}"
      - . "$HOME/.cargo/env"
      - rustc --version
      - rustup target list --installed
      - export ANDROID_NDK_HOME="$$NDK$$"
      - export ANDROID_HOME="$$SDK$$"
      - test ! -e ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test ! -e ../app/src/main/jniLibs/x86_64/libnavi.so
      # Builds every ABI listed in gradle.properties naviAbis (default both 64-bit).
      - ../scripts/build-android-native.sh all release
      - test -f ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test -f ../app/src/main/jniLibs/x86_64/libnavi.so
      - test -f ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
      - sha256sum ../app/src/main/jniLibs/arm64-v8a/libnavi.so ../app/src/main/jniLibs/x86_64/libnavi.so
      - sha256sum ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
      - gradle assembleRelease
    ndk: r27c

MaintainerNotes: |
  Local F-Droid buildability check metadata (not the fdroiddata submission).
  sudo: installs apt packages only (no rustup package, no rustup as root).
  Rust 1.98.0 is installed in prebuild as the fdroid build user, with
  aarch64-linux-android, x86_64-linux-android, and wasm32-unknown-unknown.
  rm: repo-root paths to prebuilt libnavi.so only.
  build: scripts/build-android-native.sh all (reads gradle.properties naviAbis),
  asserts plugin.wasm, then Gradle. Shipped ABIs: naviAbis (default arm64-v8a,x86_64).

ArchivePolicy: 0 versions
CurrentVersion: 0.3.6-beta
CurrentVersionCode: 11
