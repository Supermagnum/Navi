AutoName: Navi

RepoType: git
Repo: https://github.com/Supermagnum/Navi.git

# Convenience prebuilts under jniLibs/ and compiled/ are for local/CI Gradle-only
# assemble and sideload. F-Droid must not package them: scandelete/rm remove
# those files, then the recipe cross-compiles from Rust source and rebuilds
# plugin wasm guests. Liberation Sans (SIL OFL 1.1) under res/font/ is source
# font data, not a prebuilt binary.

Builds:
  - versionName: 0.3.25-beta
    versionCode: 30
    commit: v0.3.25-beta
    timeout: 14400
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends
        build-essential
        curl
        ca-certificates
        openjdk-17-jdk-headless
        python3
        pkg-config
        libssl-dev
      - update-java-alternatives -a || true
    gradle: yes
    scandelete:
      - compiled/
      - app/src/main/jniLibs/
      - app/src/main/assets/plugins/
    rm:
      - app/src/main/jniLibs/arm64-v8a/libnavi.so
      - app/src/main/jniLibs/x86_64/libnavi.so
    prebuild:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/.cargo/bin:${PATH:-}"
      - |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | bash -s -- -y --default-toolchain 1.98.0 --profile minimal
        fi
      - . "$HOME/.cargo/env"
      - rustup toolchain install 1.98.0 --profile minimal
      - rustup default 1.98.0
      - rustup target add aarch64-linux-android x86_64-linux-android wasm32-unknown-unknown
      - rustc --version
      - NDK="$$NDK$$"
      - test -n "$NDK"
      - test -d "$NDK"
      - CLANG_PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - mkdir -p ../.cargo
      - |
        printf '%s\n' \
          '[target.x86_64-linux-android]' \
          "linker = \"$CLANG_PRE/x86_64-linux-android34-clang\"" \
          'rustflags = ["-C", "link-arg=-lc++_shared"]' \
          '' \
          '[target.aarch64-linux-android]' \
          "linker = \"$CLANG_PRE/aarch64-linux-android34-clang\"" \
          'rustflags = ["-C", "link-arg=-lc++_shared"]' \
          > ../.cargo/config.toml
      - printf 'sdk.dir=%s\nndk.dir=%s\n' "$$SDK$$" "$$NDK$$" > ../local.properties
      - test ! -e ../compiled/navi-release.apk
      - test ! -e ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test ! -e ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
    build:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/.cargo/bin:${PATH:-}"
      - . "$HOME/.cargo/env"
      - rustc --version
      - rustup target list --installed
      - export ANDROID_NDK_HOME="$$NDK$$"
      - export ANDROID_HOME="$$SDK$$"
      - test ! -e ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test ! -e ../app/src/main/jniLibs/x86_64/libnavi.so
      # Builds every ABI listed in gradle.properties naviAbis (default both 64-bit).
      # assembleRelease also runs scripts/build-plugin-wasm.sh (right_to_roam_camping,
      # cat/CATS, imu, and test guests) for wasm32-unknown-unknown.
      - ../scripts/build-android-native.sh all release
      - test -f ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test -f ../app/src/main/jniLibs/x86_64/libnavi.so
      - ../scripts/build-plugin-wasm.sh
      - test -f ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
      - test -f ../app/src/main/assets/plugins/imu/plugin.wasm
      - test -f ../app/src/main/assets/plugins/cat/plugin.wasm
      - test -f ../app/src/main/res/font/liberation_sans.ttf
      - sha256sum ../app/src/main/jniLibs/arm64-v8a/libnavi.so ../app/src/main/jniLibs/x86_64/libnavi.so
      - sha256sum ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm ../app/src/main/assets/plugins/imu/plugin.wasm ../app/src/main/assets/plugins/cat/plugin.wasm
      - gradle assembleRelease
    ndk: r27c

MaintainerNotes: |
  Local F-Droid buildability check metadata (also the paste source for
  supermag/fdroiddata !45644). sudo: apt packages only (no rustup as root).
  Rust 1.98.0 via rustup in prebuild as the build user, with
  aarch64-linux-android, x86_64-linux-android, and wasm32-unknown-unknown.
  scandelete: compiled/ sideload APKs, jniLibs/ prebuilt .so, and assets/plugins/
  committed wasm guests. build: scripts/build-android-native.sh all, then
  scripts/build-plugin-wasm.sh, then Gradle. Liberation Sans Regular
  (app/src/main/res/font/liberation_sans.ttf) is SIL OFL 1.1 source font data.
  Shipped ABIs: naviAbis (default arm64-v8a,x86_64). UpdateCheckMode allows
  -beta tags (v0.3.25-beta).

ArchivePolicy: 0 versions
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+)?$
UpdateCheckData: app/build.gradle.kts|versionCode\s=\s(\d+)|.|versionName\s=\s"(.*)"
CurrentVersion: 0.3.25-beta
CurrentVersionCode: 30
