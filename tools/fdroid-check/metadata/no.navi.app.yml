AntiFeatures:
  TetheredNet:
    en-US: "Optional online features talk to specific hosts that are not trivial to
      replace without changing the app or a config the user does not see first: map
      packs from navigate-me.duckdns.org (Geofabrik-derived extracts), OpenFreeMap
      basemap tiles, Mapterhorn elevation, DATEX traffic feeds, and amateur-radio
      repeater bundles from the same pack server. Optional online place search (off
      by default) queries a Nominatim-compatible geocoder. Routing and navigation
      run offline after map data is on the device.\n"
Categories:
  - Navigation
License: GPL-3.0-or-later
AuthorName: Navi contributors
WebSite: https://github.com/Supermagnum/Navi
SourceCode: https://github.com/Supermagnum/Navi
IssueTracker: https://github.com/Supermagnum/Navi/issues
Changelog: https://github.com/Supermagnum/Navi/releases
Donate: https://github.com/Supermagnum/Navi#support-navi

AutoName: Navi

RepoType: git
Repo: https://github.com/Supermagnum/Navi.git

Builds:
  - versionName: 0.3.25-beta
    versionCode: 30
    commit: v0.3.25-beta
    timeout: 14400
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential curl ca-certificates
        python3 pkg-config libssl-dev
    gradle:
      - yes
    prebuild:
      - export 
        PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/.cargo/bin:${PATH:-}"
      - "if ! command -v rustup >/dev/null 2>&1; then\n  curl --proto '=https' --tlsv1.2
        -sSf https://sh.rustup.rs | bash -s -- -y --default-toolchain 1.98.0 --profile
        minimal\nfi\n"
      - . "$HOME/.cargo/env"
      - rustup toolchain install 1.98.0 --profile minimal
      - rustup default 1.98.0
      - rustup target add aarch64-linux-android x86_64-linux-android wasm32-unknown-unknown
      - rustc --version
      - NDK="$$NDK$$"
      - test -n "$NDK"
      - test -d "$NDK"
      - CLANG_PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - mkdir -p ../.cargo
      - "printf '%s\\n' \\\n  '[target.x86_64-linux-android]' \\\n  \"linker = \\\"\
        $CLANG_PRE/x86_64-linux-android34-clang\\\"\" \\\n  'rustflags = [\"-C\",
        \"link-arg=-lc++_shared\"]' \\\n  '' \\\n  '[target.aarch64-linux-android]'
        \\\n  \"linker = \\\"$CLANG_PRE/aarch64-linux-android34-clang\\\"\" \\\n \
        \ 'rustflags = [\"-C\", \"link-arg=-lc++_shared\"]' \\\n  > ../.cargo/config.toml\n"
      - printf 'sdk.dir=%s\nndk.dir=%s\n' "$$SDK$$" "$$NDK$$" > ../local.properties
      - test ! -e ../compiled/navi-release.apk
      - test ! -e ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test ! -e ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
    scandelete:
      - compiled/
      - app/src/main/jniLibs/
    build:
      - export 
        PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${HOME}/.cargo/bin:${PATH:-}"
      - . "$HOME/.cargo/env"
      - rustc --version
      - rustup target list --installed
      - export ANDROID_NDK_HOME="$$NDK$$"
      - export ANDROID_HOME="$$SDK$$"
      - test ! -e ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test ! -e ../app/src/main/jniLibs/x86_64/libnavi.so
      - ../scripts/build-android-native.sh all release
      - test -f ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test -f ../app/src/main/jniLibs/x86_64/libnavi.so
      - ../scripts/build-plugin-wasm.sh
      - test -f ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
      - test -f ../app/src/main/assets/plugins/imu/plugin.wasm
      - test -f ../app/src/main/assets/plugins/cat/plugin.wasm
      - test -f ../app/src/main/res/font/liberation_sans.ttf
      - sha256sum ../app/src/main/jniLibs/arm64-v8a/libnavi.so ../app/src/main/jniLibs/x86_64/libnavi.so
      - sha256sum ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
        ../app/src/main/assets/plugins/imu/plugin.wasm ../app/src/main/assets/plugins/cat/plugin.wasm
      - gradle assembleRelease
    ndk: r27c

MaintainerNotes: |
  Local F-Droid buildability check metadata (also the paste source for
  supermag/fdroiddata !45644). sudo: apt packages only (no rustup as root;
  Trixie buildserver already has JDK 21, do not apt-install JDK 17).
  Rust 1.98.0 via rustup in prebuild as the build user, with
  aarch64-linux-android, x86_64-linux-android, and wasm32-unknown-unknown.
  scandelete: compiled/ sideload APKs and jniLibs/ dirs (prebuilt .so are
  gitignored; assets/plugins/ is gitignored so not listed in scandelete/rm). build: scripts/build-android-native.sh all, then
  scripts/build-plugin-wasm.sh, then Gradle. Liberation Sans Regular
  (app/src/main/res/font/liberation_sans.ttf) is SIL OFL 1.1 source font data.
  Shipped ABIs: naviAbis (default arm64-v8a,x86_64). UpdateCheckMode allows
  -beta tags (v0.3.25-beta). No ArchivePolicy: lint rejects 0 with AutoUpdate.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+)?$
UpdateCheckData: app/build.gradle.kts|versionCode\s=\s(\d+)|.|versionName\s=\s"(.*)"
CurrentVersion: 0.3.25-beta
CurrentVersionCode: 30
