  # MWM client (CoMaps leaf maps + drape). Everything native is built from source in this order:
  #   1. build: scripts/fetch-comaps.sh clones CoMaps at the commit pinned in third_party/comaps.pin.json
  #      (the only network use besides crates, before Gradle; it runs after the source scan, so the
  #      CoMaps tree is built from the pin and never scanned as repository content) and runs its configure step;
  #   2. build: scripts/build-comaps-android.sh applies patches/comaps/*.patch and compiles liborganicmaps.so
  #      with the NDK; scripts/build-android-native.sh compiles the Rust core (libnavi.so) and the UniFFI
  #      bindings; scripts/build-plugin-wasm.sh compiles the plugin guests;
  #   3. gradle: :comaps-sdk generates the drape symbol atlases (puck, APRS and CoMaps icons) from the SVG
  #      sources in this repository with scripts/generate-comaps-symbols.py (librsvg2-bin + python3-pil).
  # No prebuilt .so / .jar / atlas is read from the repository. `commit:` is the release tag commit; the
  # local check (tools/fdroid-check/run-podman-build.sh) replaces PLACEHOLDER_COMMIT with its snapshot.
