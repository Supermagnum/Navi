AntiFeatures:
  TetheredNet:
    en-US: >
      Optional online features talk to specific hosts that are not trivial
      to replace without changing the app or a config the user does not see
      first: map packs from navigate-me.duckdns.org (Geofabrik-derived extracts),
      OpenFreeMap basemap tiles, Mapterhorn elevation, DATEX traffic feeds, and
      amateur-radio repeater bundles from the same pack server. Optional online
      place search (off by default) queries a Nominatim-compatible geocoder.
      Routing and navigation run offline after map data is on the device.
Categories:
  - Navigation
License: GPL-3.0-or-later
AuthorName: Navi contributors
