MaintainerNotes: |
  Paste-ready next release recipe (keep tools/fdroid-check mirror identical to
  upstream master). VC 30/31 disabled (switched to reproducible builds). VC 32
  adds Binaries + AllowedAPKSigningKeys. sudo includes Debian rustup plus
  autoconf/automake/libtool for Hamlib. prebuild installs Rust 1.98.0
  (rust-toolchain.toml). SOURCE_DATE_EPOCH for zip determinism. build uses
  scripts/build-android-native.sh all release (Cargo profile release-android,
  panic=abort) then build-plugin-wasm.sh, with Hamlib/libnavi presence gates.
  UpdateCheckMode allows -beta tags.

