      - rustc --version
      - NDK="$$NDK$$"
      - test -n "$NDK"
      - test -d "$NDK"
      - CLANG_PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - mkdir -p ../.cargo
      - echo '[target.x86_64-linux-android]' > ../.cargo/config.toml
      - echo "linker = \"$CLANG_PRE/x86_64-linux-android34-clang\"" >> ../.cargo/config.toml
