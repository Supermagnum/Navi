Repo: https://github.com/Supermagnum/Navi.git

# Convenience prebuilts under jniLibs/ are for local/CI Gradle-only assemble.
# F-Droid must not package them: prebuild deletes them, then cross-compiles from
# Rust source (see Builds[].prebuild / Builds[].build).

Builds:
  - versionName: 0.3.6-beta
    versionCode: 11
    commit: PLACEHOLDER_COMMIT
    timeout: 14400
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends
        build-essential
        curl
        ca-certificates
        openjdk-17-jdk-headless
        python3
        pkg-config
        libssl-dev
      # Non-fatal on images where alternatives are already set.
      - update-java-alternatives -a || true
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
        | bash -s -- -y --default-toolchain stable
      # Each item is its own login shell (sudo steps do not share env).
      - bash -lc 'source "$HOME/.cargo/env" && rustup toolchain install 1.98.0 --profile
        minimal'
      - bash -lc 'source "$HOME/.cargo/env" && rustup default 1.98.0'
      - bash -lc 'source "$HOME/.cargo/env" && rustup target add aarch64-linux-android
        x86_64-linux-android wasm32-unknown-unknown'
    # List form: fdroidserver joins with "; " and runs under bash -e -u -o pipefail,
    # so a failed step still aborts the recipe (same fail-fast as former && chains).
    prebuild:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${CARGO_HOME:-$HOME/.cargo}/bin:${PATH:-}"
      - . "${CARGO_HOME:-$HOME/.cargo}/env" 2>/dev/null || true
      - NDK="$$NDK$$"
      - test -n "$NDK"
      - test -d "$NDK"
      - CLANG_PRE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
      - mkdir -p ../.cargo
      - |
        printf '%s\n' \
          '[target.x86_64-linux-android]' \
          "linker = \"$CLANG_PRE/x86_64-linux-android34-clang\"" \
          'rustflags = ["-C", "link-arg=-lc++_shared"]' \
          '' \
          '[target.aarch64-linux-android]' \
          "linker = \"$CLANG_PRE/aarch64-linux-android34-clang\"" \
          'rustflags = ["-C", "link-arg=-lc++_shared"]' \
          > ../.cargo/config.toml
      - rm -f ../app/src/main/jniLibs/*/libnavi.so
      - printf 'sdk.dir=%s\nndk.dir=%s\n' "$$SDK$$" "$$NDK$$" > ../local.properties
    build:
      - export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${CARGO_HOME:-$HOME/.cargo}/bin:${PATH:-}"
      - . "${CARGO_HOME:-$HOME/.cargo}/env" 2>/dev/null || true
      - export ANDROID_NDK_HOME="$$NDK$$"
      - export ANDROID_HOME="$$SDK$$"
      - test ! -e ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test ! -e ../app/src/main/jniLibs/x86_64/libnavi.so
      # Guest .wasm is built from source (never committed). Gradle preBuild also
      # runs this; invoke explicitly so F-Droid logs show the wasm stage.
      - ../scripts/build-plugin-wasm.sh
      - test -f ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
      - ../scripts/build-android-native.sh aarch64-linux-android release
      - ../scripts/build-android-native.sh x86_64-linux-android release
      - test -f ../app/src/main/jniLibs/arm64-v8a/libnavi.so
      - test -f ../app/src/main/jniLibs/x86_64/libnavi.so
      - sha256sum ../app/src/main/jniLibs/arm64-v8a/libnavi.so ../app/src/main/jniLibs/x86_64/libnavi.so
      - sha256sum ../app/src/main/assets/plugins/right_to_roam_camping/plugin.wasm
      - gradle assembleRelease
    ndk: r27c
    gradle:
      - yes

MaintainerNotes: |
  Local F-Droid buildability check metadata (not the fdroiddata submission).
  Real shipped ABIs (app/build.gradle.kts abiFilters + verified release APK):
  arm64-v8a and x86_64 only — not armeabi / armeabi-v7a / x86 / mips / mips64.
  Per ABI: libnavi.so, libmaplibre.so, libjnidispatch.so,
  libandroidx.graphics.path.so. No libc++_shared.so in the packaged APK.
  Rust via rustup in sudo:; .cargo/config.toml rewritten from $$NDK$$ in prebuild.
  dependenciesInfo.includeInApk/Bundle are false in app/build.gradle.kts.
  libnavi.so: prebuild rm removes committed jniLibs prebuilts; build:
  runs scripts/build-plugin-wasm.sh (wasm32-unknown-unknown guests into
  app/src/main/assets/plugins/, never committed) then
  scripts/build-android-native.sh for aarch64 and x86_64 before assembleRelease
  (asserts absence before compile and presence after).
  Phase 5a: navi-ffi links navi-plugin-host (wasmtime 48 Cranelift JIT).
  Shipped ABIs arm64-v8a + x86_64 both have Cranelift; no armeabi-v7a.
  io.opencensus: AGP Unified Test Platform host tooling only
  (com.google.testing.platform via com.android.tools.utp) — not on
  releaseRuntimeClasspath, not shipped in the APK, not used for app telemetry.
  Do not globally exclude (breaks instrumented-test UTP). False-positive tracker flag.

