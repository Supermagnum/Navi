# Pinned toolchain for local builds and CI (not floating "stable").
# rust-version in Cargo.toml matches this channel for *build reproducibility*.
# It is NOT a formally verified minimum (no lower-bound CI matrix yet).
# Raised to 1.88 because current deps (osmpbf, pmtiles, time, home) require it.
[toolchain]
channel = "1.88.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
