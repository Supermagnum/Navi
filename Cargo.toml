[workspace]
resolver = "2"
members = [
    "core",
    "navi-ffi",
    "navi-linux",
    "navi-desktop",
    "plugin-host",
    "plugin-sdk",
    "plugins/log-hello",
    "plugins/busy-loop",
]
default-members = ["core", "plugin-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Pinned toolchain channel for reproducible builds (keep in sync with
# rust-toolchain.toml). This is a reproducibility pin, not a proven lower bound:
# CI builds the pinned 1.88 toolchain only — there is no MSRV matrix job yet.
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Supermagnum/naw-app"

[workspace.dependencies]
anyhow = "1"
bincode = "1"
geo = "0.29"
geo-types = "0.7"
pathfinding = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rstar = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srtm_reader = "0.5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
osmpbf = "0.3"
osm4routing = "0.8"
geotiff = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
rayon = "1"
log = "0.4"
libc = "0.2"
uniffi = "0.29"
usvg = "0.44"
resvg = "0.44"
flate2 = "1"
png = "0.17"
