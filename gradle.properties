org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=24
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.1+ uninstalls the app-under-test after connectedAndroidTest by default,
# which wipes app-private Ostlandet packs / place_index / PMTiles on real devices.
# Keep APKs installed so hardware iteration does not destroy provisioned data.
android.injected.androidTest.leaveApksInstalledAfterRun=true

# Temporary until full AGP9 built-in Kotlin migration.
android.builtInKotlin=false
android.newDsl=false

# Single source of truth for shipped Android ABIs (packaging + Rust native builds).
# Override at assemble time: ./gradlew :app:assembleRelease -PnaviAbis=arm64-v8a
# Override native builds:    NAVI_ABIS=arm64-v8a ./scripts/build-android-native.sh all release
# Allowed values: arm64-v8a, x86_64 (comma-separated). No 32-bit ABIs.
naviAbis=arm64-v8a,x86_64
