org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=24
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.1+ uninstalls the app-under-test after connectedAndroidTest by default,
# which wipes app-private Ostlandet packs / place_index / PMTiles on real devices.
# Keep APKs installed so hardware iteration does not destroy provisioned data.
android.injected.androidTest.leaveApksInstalledAfterRun=true
