# Automatic push/PR checks. Wall-time budget: 10 minutes with warm caches.
# Jobs are independent. A newer commit on the same branch/PR cancels this run.
#
# Not in this workflow (see ci-manual.yml, android-instrumented.yml, or local):
# - Clippy / deny / audit / detekt
# - cargo test --workspace, plugin-host isolation, linux-build
# - multi-ABI release, emulator/device, map packs, the regression gate

name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "geojson-routes/**"
      - "navi-ffi/tests/regression_gate_refs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "geojson-routes/**"
      - "navi-ffi/tests/regression_gate_refs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: rust-fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  rust-lib-tests:
    name: rust-lib-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: System deps (pkg-config / OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lib-tests
          cache-targets: true

      - name: Core library tests
        run: cargo test -p driver-break-core --lib

      - name: navi-ffi library tests
        run: cargo test -p navi-ffi --lib

  android-native-compile:
    name: android-native-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-native-lib
          cache-targets: true

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Compile navi-ffi lib for arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          CLANG_PRE="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CLANG_PRE/aarch64-linux-android34-clang"
          mkdir -p .cargo
          printf '%s\n' \
            '[target.aarch64-linux-android]' \
            "linker = \"$CLANG_PRE/aarch64-linux-android34-clang\"" \
            'rustflags = ["-C", "link-arg=-lc++_shared"]' \
            > .cargo/config.toml
          cargo build -p navi-ffi --target aarch64-linux-android --lib

  kotlin-fast:
    name: kotlin-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: ktlintCheck
        run: ./gradlew :app:ktlintCheck --no-daemon

      - name: JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-app-compile:
    name: android-app-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain (wasm guests)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-app-wasm
          cache-targets: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: assembleDebug (one ABI)
        # Uses committed jniLibs when present. Native compile is the
        # android-native-compile job. F-Droid deletes the prebuilts and
        # cross-compiles from source (tools/fdroid-check/metadata/no.navi.app.yml).
        run: ./gradlew :app:assembleDebug -PnaviAbis=arm64-v8a --no-daemon
