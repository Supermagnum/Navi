# Fuzzing / input-hardening (issue #167).
#
# - pull_request / push: short per-target smoke (default 60s), advisory (continue-on-error)
# - schedule (nightly): longer runs; MWM-related targets weighted higher
# - workflow_dispatch: manual with custom duration/targets
#
# Uses nightly only for cargo-fuzz / libFuzzer. Normal builds stay on the pinned
# 1.98 toolchain in rust-toolchain.toml.

name: Fuzzing

on:
  pull_request:
  push:
    branches: [dev, main, fuzz]
  schedule:
    # 03:17 Europe/Oslo ≈ 02:17 UTC
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Seconds to run each fuzz target"
        required: true
        default: "60"
        type: string
      targets:
        description: "Comma-separated targets, or 'all'"
        required: true
        default: "all"
        type: string

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ALL_TARGETS: >-
    gpx_import datex_situation gaia_decode dump_caps_gate anytone_channel_csv
    repeater_current_json zst_decompress benshi_rf_ch benshi_settings_patch
    benshi_dev_info benshi_ht_status benshi_freq_mode_notif rigctld_reply
    repeater_checksums parse_mhz maidenhead osm_repeater_relation_xml
    repeater_csv_bytes repeater_kml_point mwm_sidecar mwm_catalog_json
    mwm_countries_txt navi_manifest_json pbf_extract_gate osm_maxspeed
    osm_conditional_maxspeed plugin_manifest flat_graph_pack
  # Heavier weight on map/sidecar/pack targets for nightly.
  NIGHTLY_WEIGHT_TARGETS: >-
    mwm_sidecar mwm_catalog_json mwm_countries_txt flat_graph_pack
    pbf_extract_gate navi_manifest_json

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    # Nightly can run many targets for ~30–60 min each; keep a high ceiling.
    timeout-minutes: 720
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned nightly + llvm-tools (fuzz only)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-15
          components: llvm-tools-preview

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang

      - name: Cache Cargo (fuzz)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> fuzz/target"
          shared-key: fuzz-nightly
          cache-targets: true

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Resolve target list and duration
        id: list
        run: |
          set -euo pipefail
          ALL="${{ env.ALL_TARGETS }}"
          case "${{ github.event_name }}" in
            schedule)
              DUR=1800
              # Prefer weighted targets first, then the rest once.
              WEIGHT="${{ env.NIGHTLY_WEIGHT_TARGETS }}"
              REST=""
              for t in $ALL; do
                skip=0
                for w in $WEIGHT; do
                  if [ "$t" = "$w" ]; then skip=1; break; fi
                done
                if [ "$skip" -eq 0 ]; then REST="$REST $t"; fi
              done
              # Run weighted targets twice (≈ 60 min each wall if sequential).
              echo "targets=$WEIGHT $WEIGHT $REST" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              DUR="${{ github.event.inputs.duration_seconds }}"
              REQ="${{ github.event.inputs.targets }}"
              if [ "$REQ" = "all" ] || [ -z "$REQ" ]; then
                echo "targets=$ALL" >> "$GITHUB_OUTPUT"
              else
                echo "targets=$(echo "$REQ" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              DUR=60
              echo "targets=$ALL" >> "$GITHUB_OUTPUT"
              ;;
          esac
          if [ -z "${DUR:-}" ]; then DUR=60; fi
          echo "duration=$DUR" >> "$GITHUB_OUTPUT"

      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          set -euo pipefail
          DUR="${{ steps.list.outputs.duration }}"
          mkdir -p artifacts
          fail=0
          for t in ${{ steps.list.outputs.targets }}; do
            echo "::group::fuzz $t (${DUR}s)"
            if ! cargo +nightly-2026-06-15 fuzz run "$t" -- -max_total_time="$DUR" -timeout=10 -rss_limit_mb=2048; then
              echo "::error::fuzz target $t failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: |
            fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
