# Android instrumented tests — separate from per-PR CI.
# These need an emulator (slow; multi-minute suites) and often local fixtures under
# /data/local/tmp/navi_fixtures. Mirror of Rust's #[ignore] fixture integrations:
# not part of the default PR gate.
#
# Trigger: manual workflow_dispatch only (no schedule). Not a required check.
# Trusted instrumented results come from a local Automotive AVD matching the
# validated profile, and from real hardware when available — see
# docs/real-hardware-testing.md.
#
# Device profile: Android Automotive (not generic phone AOSP). MapLibre Vulkan /
# hillshade / rotation fixes in this project were validated on AAOS AVDs; the
# previous API 30 `target: default` phone image is a distinct, untested class
# that aborted the suite on ApproachInstructionInstrumentedTest (see README
# known issues).
#
# Evidence: collected inside scripts/ci-connected-android-test.sh (EXIT trap) while
# the emulator-runner still owns the AVD, then uploaded with if: always(). A
# separate always() runner-diagnostics step captures host free/df/dmesg when the
# device is already gone. cancel-in-progress is false so a manual diagnostic
# dispatch is not killed by a later push/dispatch.

name: Android instrumented

on:
  workflow_dispatch:

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connected:
    name: connectedDebugAndroidTest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # continue-on-error: subsequent always() steps still run even if this action
      # aborts hard; the script EXIT trap still collects device-side evidence first.
      - name: Run instrumented tests (API 33 Automotive)
        id: instrumented
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: android-automotive
          force-avd-creation: false
          # Extra RAM: MapLibre suites have previously lost the emulator mid-run.
          # Do not pass -skin here — Automotive AVD keeps ~320x640 and -skin can
          # confuse boot; scripts/ci-connected-android-test.sh sets wm size after boot.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -no-metrics
          disable-animations: true
          # Must be a single command: the action runs each script line as its own sh -c.
          script: bash scripts/ci-connected-android-test.sh

      - name: Runner diagnostics when emulator is gone
        if: always()
        run: |
          set +e
          EVIDENCE="${GITHUB_WORKSPACE}/instrumented-evidence"
          mkdir -p "${EVIDENCE}/runner"
          {
            echo "step=runner_diagnostics"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "instrumented_outcome=${{ steps.instrumented.outcome }}"
            echo "instrumented_conclusion=${{ steps.instrumented.conclusion }}"
          } | tee "${EVIDENCE}/runner/step_meta.txt"
          free -h | tee "${EVIDENCE}/runner/free.txt"
          df -h | tee "${EVIDENCE}/runner/df.txt"
          dmesg -T 2>/dev/null | tail -n 400 | tee "${EVIDENCE}/runner/dmesg_tail.txt" || true
          journalctl -n 200 --no-pager 2>/dev/null | tee "${EVIDENCE}/runner/journal_tail.txt" || true
          ps auxww | grep -E 'qemu|emulator|adb|gradle' | grep -v grep | tee "${EVIDENCE}/runner/ps_emu.txt" || true
          adb devices -l 2>&1 | tee "${EVIDENCE}/runner/adb_devices_post_step.txt" || true
          if [ ! -d "${EVIDENCE}" ] || [ ! -f "${EVIDENCE}/collection_started.txt" ]; then
            echo "emulator-runner never wrote instrumented-evidence — host-only fallback" \
              | tee "${EVIDENCE}/EMULATOR_GONE.txt"
          elif [ ! -s "${EVIDENCE}/logcat.txt" ]; then
            echo "logcat.txt missing or empty after instrumented step" \
              | tee -a "${EVIDENCE}/EMULATOR_GONE.txt"
          fi
          ls -laR "${EVIDENCE}" | tee "${EVIDENCE}/runner/listing_after_diagnostics.txt"
          # Fail this step only as a signal in logs; upload still runs (always()).
          if [ ! -f "${EVIDENCE}/collection_started.txt" ]; then
            echo "::warning::No evidence sentinel — instrumented script may not have started"
          fi

      - name: Upload instrumented crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-crash-evidence
          path: instrumented-evidence
          if-no-files-found: warn
          retention-days: 14

      # Surface the real test result as the job conclusion after evidence is saved.
      - name: Fail job if instrumented tests failed
        if: always() && steps.instrumented.outcome != 'success'
        run: |
          echo "Instrumented step outcome=${{ steps.instrumented.outcome }} conclusion=${{ steps.instrumented.conclusion }}"
          exit 1
