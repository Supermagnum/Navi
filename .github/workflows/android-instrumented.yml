# Android instrumented tests — separate from per-PR CI.
# These need an emulator (slow; multi-minute suites) and often local fixtures under
# /data/local/tmp/navi_fixtures. Mirror of Rust's #[ignore] fixture integrations:
# not part of the default PR gate.
#
# Trigger: nightly schedule or manual workflow_dispatch.

name: Android instrumented

on:
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: connectedDebugAndroidTest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Run instrumented tests (API 30 AOSP)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
