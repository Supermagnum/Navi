# Android instrumented tests — separate from per-PR CI.
# These need an emulator (slow; multi-minute suites) and often local fixtures under
# /data/local/tmp/navi_fixtures. Mirror of Rust's #[ignore] fixture integrations:
# not part of the default PR gate.
#
# Trigger: nightly schedule or manual workflow_dispatch.
#
# Device profile: Android Automotive (not generic phone AOSP). MapLibre Vulkan /
# hillshade / rotation fixes in this project were validated on AAOS AVDs; the
# previous API 30 `target: default` phone image is a distinct, untested class
# that aborted the suite on ApproachInstructionInstrumentedTest (see README
# known issues).

name: Android instrumented

on:
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: connectedDebugAndroidTest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests (API 33 Automotive)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: android-automotive
          force-avd-creation: false
          # Landscape HUD resolution + extra RAM: default Automotive CI skin can
          # report ~320px width (breaks width-fraction asserts) and MapLibre
          # suites have previously lost the emulator mid-run under memory pressure.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -memory 4096 -skin 1920x1080
          disable-animations: true
          script: |
            set +e
            EVIDENCE="${GITHUB_WORKSPACE}/instrumented-evidence"
            mkdir -p "$EVIDENCE/tombstones"
            echo "api=33 target=android-automotive skin=1920x1080 memory=4096" > "$EVIDENCE/env.txt"
            adb devices -l > "$EVIDENCE/adb_devices_before.txt" 2>&1 || true
            adb shell getprop ro.build.fingerprint > "$EVIDENCE/fingerprint.txt" 2>&1 || true
            adb shell wm size > "$EVIDENCE/wm_size.txt" 2>&1 || true
            adb shell wm density > "$EVIDENCE/wm_density.txt" 2>&1 || true
            adb logcat -c || true
            # Continuous logcat survives emulator death better than a post-mortem dump.
            adb logcat -v threadtime > "$EVIDENCE/logcat.txt" 2>&1 &
            LOGCAT_PID=$!
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            status=$?
            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            adb devices -l > "$EVIDENCE/adb_devices_after.txt" 2>&1 || true
            adb logcat -b crash -d > "$EVIDENCE/logcat_crash.txt" 2>&1 || true
            adb shell "ls -la /data/tombstones/" > "$EVIDENCE/tombstones_ls.txt" 2>&1 || true
            adb pull /data/tombstones "$EVIDENCE/tombstones" 2>&1 | tee "$EVIDENCE/tombstones_pull.txt" || true
            cp -a app/build/reports/androidTests/connected "$EVIDENCE/reports" 2>&1 || true
            cp -a app/build/outputs/androidTest-results "$EVIDENCE/androidTest-results" 2>&1 || true
            echo "gradle_exit=$status" > "$EVIDENCE/status.txt"
            ls -laR "$EVIDENCE" > "$EVIDENCE/listing.txt" 2>&1 || true
            exit $status

      - name: Upload instrumented crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-crash-evidence
          path: instrumented-evidence
          if-no-files-found: warn
          retention-days: 14
