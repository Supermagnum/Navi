# Android instrumented tests — separate from per-PR CI.
# These need an emulator (slow; multi-minute suites) and often local fixtures under
# /data/local/tmp/navi_fixtures. Mirror of Rust's #[ignore] fixture integrations:
# not part of the default PR gate.
#
# Trigger: nightly schedule or manual workflow_dispatch.
#
# Device profile: Android Automotive (not generic phone AOSP). MapLibre Vulkan /
# hillshade / rotation fixes in this project were validated on AAOS AVDs; the
# previous API 30 `target: default` phone image is a distinct, untested class
# that aborted the suite on ApproachInstructionInstrumentedTest (see README
# known issues).

name: Android instrumented

on:
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: android-instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    name: connectedDebugAndroidTest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests (API 33 Automotive)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: android-automotive
          force-avd-creation: false
          # Extra RAM: MapLibre suites have previously lost the emulator mid-run.
          # Do not pass -skin here — Automotive AVD keeps ~320x640 and -skin can
          # confuse boot; scripts/ci-connected-android-test.sh sets wm size after boot.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -no-metrics
          disable-animations: true
          # Must be a single command: the action runs each script line as its own sh -c.
          script: bash scripts/ci-connected-android-test.sh

      - name: Upload instrumented crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-crash-evidence
          path: instrumented-evidence
          if-no-files-found: warn
          retention-days: 14
